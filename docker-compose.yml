# Local dev stack. Prod hosting deferred (see plan).
# Postgres ships with pgvector for embedding similarity (used from Phase 2).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadint
      POSTGRES_PASSWORD: leadint
      POSTGRES_DB: leadint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
