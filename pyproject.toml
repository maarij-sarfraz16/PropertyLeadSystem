[project]
name = "lead-intelligence"
version = "0.1.0"
description = "Automated Property Lead Intelligence System"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The realtime broker is asyncio; its tests carry @pytest.mark.asyncio.
asyncio_mode = "strict"
